<!DOCTYPE html>
<html lang="en">   
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>music</title>
  <link rel="icon" type="image/png" href="favicon (7).ico">
  <link href="style.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 15vh;
      box-sizing: border-box;
      font-family: Georgia, serif;
      text-align: center;
      background: white;
    }

    .top-row {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 0;
      text-align: center;
      background: white;
      z-index: 1000;
    }

    .top-row a {
      text-decoration: none;
      color: blue;
      font-weight: bold;
      font-size: 14px;
      padding: 5px 10px;
      border: 1px solid blue;
    }

    .top-row a:hover {
      background-color: blue;
      color: white;
    }

    h3 {
      color: blue;
      margin: 20px 0 10px;
    }

    p {
      margin: 10px 0 30px;
    }

    iframe {
      margin: 20px 0;
      max-width: 90%;
    }

    .image-container {
      display: flex;
      justify-content: center;
      gap: 20px; /* space between images */
      width: 66%; /* two-thirds of page width */
      margin-top: 40px;
      flex-wrap: wrap; /* allow wrapping on small screens */
    }

    .image-container img {
      max-width: 100%; /* don’t stretch beyond natural size */
      flex: 1 1 45%; /* each takes about half, but flexible */
      height: auto;  /* keeps aspect ratio */
      border-radius: 8px; /* optional rounded corners */
    }

    @media (max-width: 768px) {
      .image-container {
        width: 90%; /* more breathing room on small screens */
      }
      .image-container img {
        flex: 1 1 100%; /* stack vertically on small screens */
      }
    
  </style>
</head>

<body>
  <div class="top-row">
    <a href="index.html">Home</a>
  </div>

  <p>Soaring Into the Great Church</p>

  <h3><a href="https://www.youtube.com/@jeremy_field/videos">youtube 😟</a></h3>
  <h3><a href="https://jeremyfield.bandcamp.com/">bandcamp 🤔</a></h3>
  <h3><a href="https://open.spotify.com/artist/0O1bxlmXvRG91shLMPdvul">spotify 😬</a></h3>
  <h3><a href="https://music.apple.com/us/artist/jeremy-field/1698543447">apple music 😠</a></h3>
<br><br><br>
 <div class="image-container">
    <img src="soaring 1 cover.jpg" alt="Image 1">
    <img src="soaring 2 cover.jpg" alt="Image 2">
  </div>
<br><br><br><br><br>
  
  
</body>
</html>
