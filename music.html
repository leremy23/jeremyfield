  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 15vh;
      box-sizing: border-box;
      font-family: Georgia, serif;
      text-align: center;
      background: white;
    }

    .top-row {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 0;
      text-align: center;
      background: white;
      z-index: 1000;
    }

    .top-row a {
      text-decoration: none;
      color: blue;
      font-weight: bold;
      font-size: 14px;
      padding: 5px 10px;
      border: 1px solid blue;
    }

    .top-row a:hover {
      background-color: blue;
      color: white;
    }

    h3 {
      color: blue;
      margin: 20px 0 10px;
    }

    p {
      margin: 10px 0 30px;
    }

    iframe {
      margin: 20px 0;
      max-width: 90%;
    }
